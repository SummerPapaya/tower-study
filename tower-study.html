:root{

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font:14px/1.5 "Noto Serif SC","Songti SC","STSong","SimSun",serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#c{cursor:var(--cur,default)}
#c.pointing{cursor:var(--cur-hot,pointer)}

html{cursor:var(--cur,auto)}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
/* parchment card with a double ink border */
.card{position:relative;color:var(--ink);background:var(--paper-grain),radial-gradient(130% 150% at 50% 35%,#f8efdc 0%,#f2e5c9 62%,#e5d2ab 100%);border:1px solid rgba(58,42,31,.6);border-radius:10px;box-shadow:inset 0 0 0 3px rgba(248,239,220,.9),inset 0 0 0 4px rgba(58,42,31,.3),0 10px 24px rgba(18,10,4,.3)}

.plate{pointer-events:auto;padding:13px 20px 12px;max-width:min(360px,100%)}
.plate h1{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-weight:400;font-size:28px;line-height:1.1;letter-spacing:.14em;color:var(--ink);text-wrap:balance}
.plate h1 small{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--rust)}
.rule{position:relative;height:9px;margin:7px 0 5px}

.rule i{position:absolute;left:50%;top:1px;width:7px;height:7px;margin-left:-3.5px;transform:rotate(45deg);background:#f5ead3;border:1px solid rgba(58,42,31,.6)}

.right{display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
.finds{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.finds-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;font-size:12px;color:var(--ink-2);letter-spacing:.12em}
.finds-head b{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:20px;color:var(--rust);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.finds ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,28px);gap:6px}
.finds li{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-size:14px;line-height:1;color:var(--ink-3);border:1px dashed rgba(58,42,31,.38);transition:color .4s,border-color .4s}

.finds li.got{color:#fbefdc;border-color:transparent;background:radial-gradient(circle at 34% 30%,#dc8070 0,#b4483c 36%,#8e3229 70%,#6c231d 100%);box-shadow:0 1px 2px rgba(60,20,10,.45),inset 0 -2px 3px rgba(60,10,5,.35),inset 0 2px 2px rgba(255,205,185,.35),0 0 0 2px rgba(163,63,53,.18);text-shadow:0 1px 0 rgba(60,10,5,.55)}

.brass{pointer-events:auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid #5b3f18;color:var(--walnut-2);background:radial-gradient(circle at 35% 28%,#fff2c8 0,var(--brass) 46%,var(--brass-lo) 100%);box-shadow:inset 0 0 0 3px rgba(255,242,205,.28),inset 0 -3px 5px rgba(80,50,10,.38),0 4px 10px rgba(18,10,4,.38);transition:filter .2s,box-shadow .25s,transform .15s}

.brass:active{transform:translateY(1px)}
.brass[aria-pressed="true"]{box-shadow:inset 0 0 0 3px rgba(255,242,205,.3),inset 0 -3px 5px rgba(80,50,10,.38),0 0 0 3px rgba(246,221,152,.3),0 0 16px rgba(246,200,110,.45),0 4px 10px rgba(18,10,4,.38)}

.dock{position:relative;pointer-events:auto;justify-self:center;width:min(880px,100%);padding:13px 18px 10px;border-radius:14px;color:var(--cream);display:flex;flex-direction:column;gap:9px;
  background:var(--wood-grain),linear-gradient(180deg,#5d3b27 0%,#4b2f1f 55%,#3f2719 100%);background-size:400px 120px,auto;
  border:1px solid #22140b;box-shadow:inset 0 0 0 2px rgba(20,10,4,.35),inset 0 0 0 3px rgba(216,176,92,.55),inset 0 3px 8px rgba(255,220,170,.08),0 14px 30px rgba(12,6,2,.42)}
.corner{position:absolute;width:15px;height:15px;border:2px solid var(--brass);opacity:.9;pointer-events:none}
.corner.tl{top:7px;left:7px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.corner.tr{top:7px;right:7px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.corner.bl{bottom:7px;left:7px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.corner.br{bottom:7px;right:7px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wx{display:flex;flex-direction:column;line-height:1.2;min-width:46px;padding-left:4px}

.medals{display:flex;gap:8px;flex-wrap:wrap}
.medal{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;border:1px solid #1e120a;color:#ead7b1;background:radial-gradient(circle at 35% 28%,#80603f 0,#5b3e28 55%,#3c2718 100%);box-shadow:inset 0 0 0 2px rgba(216,176,92,.4),inset 0 -2px 4px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.32);transition:transform .2s,box-shadow .25s,background .25s,color .25s}
.medal svg{width:19px;height:19px}
.medal:hover{transform:translateY(-1px);color:#fff4dc}
.medal[aria-pressed="true"]{color:var(--walnut-2);border-color:#5b3f18;background:radial-gradient(circle at 35% 28%,#fff2c8 0,var(--brass) 48%,var(--brass-lo) 100%);box-shadow:inset 0 0 0 2px rgba(255,245,210,.4),inset 0 -2px 4px rgba(80,50,10,.35),0 0 0 3px rgba(246,221,152,.2),0 0 14px rgba(246,200,110,.45)}

.tab:hover{color:var(--cream)}
.tab[aria-pressed="true"]{color:var(--ink);background:var(--paper-grain),#f3e7cd;box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 0 0 1px rgba(58,42,31,.28)}
.views{margin-left:auto}
.seasons .tab{padding:0 12px;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-size:17px;letter-spacing:0}
.time{gap:14px}
.play{width:38px;height:38px;flex:none}
.play svg{width:14px;height:14px}
.rail{position:relative;flex:1;min-width:140px;padding-bottom:13px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:var(--track,linear-gradient(90deg,#0d1432 0%,#1c2554 17%,#7a5f93 23%,#f0ac8c 27%,#bcd8f0 35%,#8fc0ec 55%,#f1dcc1 68%,#f7a674 75%,#5a4a7c 81%,#1b2458 87%,#0d1432 100%));box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 1px #22140b,0 0 0 2px rgba(216,176,92,.65)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-6px;border:1px solid #5b3f18;background:radial-gradient(circle,#fff6d8 0 3px,transparent 3.5px),radial-gradient(circle at 35% 28%,#fff2c8 0,var(--brass) 48%,var(--brass-lo) 100%);box-shadow:inset 0 0 0 2px rgba(255,245,210,.35),0 2px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--track,linear-gradient(90deg,#0d1432 0%,#1c2554 17%,#7a5f93 23%,#f0ac8c 27%,#bcd8f0 35%,#8fc0ec 55%,#f1dcc1 68%,#f7a674 75%,#5a4a7c 81%,#1b2458 87%,#0d1432 100%));box-shadow:0 0 0 1px #22140b,0 0 0 2px rgba(216,176,92,.65)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:1px solid #5b3f18;background:radial-gradient(circle at 35% 28%,#fff2c8 0,var(--brass) 48%,var(--brass-lo) 100%)}
.hours{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 6px;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-size:11px;line-height:1;color:var(--brass);opacity:.9;pointer-events:none}

button,.medal,.tab,.brass,input[type=range]{cursor:var(--cur-hot,pointer)}
button:focus{outline:none}
button:focus-visible,input:focus-visible{outline:2px dotted var(--brass-hi);outline-offset:3px}
.mid{position:relative;display:flex;align-items:flex-end;justify-content:center}
.toast{pointer-events:none;padding:7px 18px 7px 8px;border-radius:999px;font-size:13px;letter-spacing:.06em;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.toast.show{opacity:1;transform:none}
.toast i{font-style:normal;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fbefdc;background:radial-gradient(circle at 34% 30%,#dc8070 0,#b4483c 36%,#8e3229 70%,#6c231d 100%);box-shadow:inset 0 -2px 3px rgba(60,10,5,.35),inset 0 2px 2px rgba(255,205,185,.35)}
.tip{position:fixed;left:0;top:0;pointer-events:none;padding:7px 12px 8px;border-radius:8px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .18s;z-index:4;max-width:230px}
.tip b{display:block;font-weight:700;font-size:13px;letter-spacing:.06em}
.tip span{color:var(--rust);letter-spacing:.04em}
.tip.show{opacity:1}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#1a2150 0%,#0b1026 70%);z-index:6;transition:opacity .9s;padding:16px;text-align:center}

.loading .ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(216,176,92,.2);border-top-color:var(--brass);margin:0 auto 14px;animation:spin 1s linear infinite}
.loading p{margin:0;font-family:"ZCOOL XiaoWei","Songti SC",serif;font-size:18px;letter-spacing:.2em;color:var(--cream-2)}
.loading.err .ring{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

  .views{margin-left:0}
  .seasons .tab{padding:0 9px;font-size:15px}
